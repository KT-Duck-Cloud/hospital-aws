# kube-state-metrics — 2조 AWS(t8, k3s)에 1조(t3 · t5)와 같게: namespace monitoring · NodePort 30810
#   모니터링 서버(t2-vm1 100.64.0.21)가 VPN 으로 100.64.0.81:30810/metrics 를 읽는다 (VPN 규칙 mon → t8@:30810 허용)
#   1조와 다른 점 — 보안 검토용 v2 4장 "Secret 내용 조회 제외": ClusterRole 에 secrets 가 없고, --resources 에서도 뺐다
#   설치: cloud/infra/node/vm1.sh 6 (up.sh 가 이 파일을 보냄) · 직접: k3s kubectl apply -f kube-state-metrics.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:   # 조회(list · watch)만. secrets 는 넣지 않는다
  - apiGroups: [""]
    resources: [configmaps, endpoints, limitranges, namespaces, nodes, persistentvolumeclaims, persistentvolumes,
                pods, replicationcontrollers, resourcequotas, services]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      nodeSelector: {duckcloud/role: master}      # t8-vm1 (k3s 서버) — DB 노드(t8-vm2)에는 올리지 않는다
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
          args:
            - --port=8080
            - --telemetry-port=8081
            - --resources=configmaps,cronjobs,daemonsets,deployments,endpoints,horizontalpodautoscalers,ingresses,jobs,leases,limitranges,namespaces,networkpolicies,nodes,persistentvolumeclaims,persistentvolumes,poddisruptionbudgets,pods,replicasets,replicationcontrollers,resourcequotas,services,statefulsets,storageclasses,volumeattachments
          ports:
            - {name: http-metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /, port: 8081}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: http-metrics, port: 8080, targetPort: http-metrics, nodePort: 30810}
