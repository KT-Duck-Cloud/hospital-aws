# 2조 AWS (t8) — 1조와 같은 차트(KT-Duck-Cloud/hospital-gitops helm/reservation-app)를 같은 이미지로 대기시킨다.
#   적용 순서 (cloud/infra/node/app.sh):  -f values-aws.yaml(차트 기본 대기값) -f 이 파일
#   승격 (provision.app_up):            helm upgrade rsv … --reuse-values -f values-dr-active.yaml   (쓰기 허용 · 서비스마다 1개)
#   복귀 (provision.app_down):          helm upgrade rsv … --reuse-values -f values-aws.yaml -f 이 파일 (다시 0개 · 읽기 전용)
#
#   1조(values-onprem.yaml)와 다른 것은 아래 세 가지뿐 — 나머지(포트 · 경로 · 프로브 · 보안 설정)는 차트 그대로라 1조와 같다
#     dbUrl  : 1조 db-service → 이 클러스터의 db-service (namespace hospital, Endpoints = t8-vm2 VPC 주소 — app.sh · provision 이 넣음)
#     image  : 1조와 같은 레지스트리 · 태그 (100.64.0.41:8086/duckcloud/*). 대기 중에 미리 받아 두고 고정(pinned) — DR 때 레지스트리가 없어도 뜬다
#     평소 0개 · READ_ONLY_MODE=true (values-aws.yaml)
# 대기(Pilot Light) — 읽기 전용 · 앱 0개. 승격 때 provision 이 --set 으로 쓰기 · 1개 (예전 values-aws.yaml 이 하던 값, 10-18 합쳐짐)
readOnlyMode: true
siteName: aws
dbUrl: mysql://db-service:3306/hospital

ingress:
  className: traefik        # 1조와 같은 Traefik 매니페스트(infra/traefik/traefik.yaml) — NodePort 30080 · 대시보드 30088

image:
  pullPolicy: IfNotPresent

services:
  auth:
    replicaCount: 0
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-auth
  reservation:
    replicaCount: 0
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-reservation
  stats:
    replicaCount: 0
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-stats
  web:
    replicaCount: 0
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-web

# ---- AWS 대기 사이트에서는 끈다 (hospital-gitops 10-18 기본값과 다름) ----
# dbPromote: pre-install/pre-upgrade 훅 — helm 을 돌릴 때마다 이 사이트 DB 를 쓰기로 바꾸고 dbClusterNodes(1조 t3 운영 DB 포함)를
#   이 DB 의 읽기 전용 복제본으로 돌린다 → 대기 사이트에서 켜면 1조 운영 DB 가 멈춘다. 승격은 컨트롤 서버(hsagent provision.promote)가 한다
dbPromote:
  enabled: false
dbResync:
  enabled: false
migrate:
  enabled: false            # 표 만들기는 1조 원본 DB 에서만 (복제본은 read_only)
