# /etc/systemd/system/headscale.service.d/guard.conf — 시작 전 가드: 다른 서버 Headscale 이 주 서버면 시작하지 않는다
[Service]
ExecStartPre=/usr/bin/python3 -c "import sys; sys.path.insert(0, '/opt/hospital-common'); import json; from common.host import Host; from services.hsha import ha; from services.hsha.node import HsNode; c = json.load(open('/etc/hospital-common/entry.json')); ha.Guard(HsNode(c['role'], Host()), c['peer_health']).pre()"
